name: Smart Contract Audit Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run smart contract audit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'EOF'
          from openai import OpenAI
          import os

          client = OpenAI(api_key=os.getenv("OPENAI_API_KEY"))

          print("🔍 Starting Smart Contract Audit...")

          with open("contract.sol", "r") as f:
              contract = f.read()

          prompt = f"""
          You are a Solidity security auditor.
          Review the following smart contract for:
          - reentrancy vulnerabilities
          - integer overflows/underflows
          - logic flaws
          - access control issues
          Return a concise Markdown report.
          Contract:
          {contract}
          """

          response = client.chat.completions.create(
              model="gpt-5",
              messages=[{"role": "user", "content": prompt}],
          )

          report = response.choices[0].message.content
          print(report)

          with open("AUDIT_REPORT.md", "w") as f:
              f.write(report)

          print("\n✅ Audit completed. Report saved to AUDIT_REPORT.md")
          EOF
